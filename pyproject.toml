[project]
name = "crossflow"
version = "1.0.0"
description = "CrossFlow: city-wide ANPR sensing and fuel-aware signal control in one platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# One environment for the whole platform: CrossSight (ANPR) and XtraFlow (SUMO signal control).
# XtraFlow's exact pins are kept because its published results were produced with them.
dependencies = [
  # --- CrossSight: API, workers, simulator, OCR engine ---
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "aiokafka>=0.10",
  "kafka-python>=2.0",
  "clickhouse-connect>=0.7",
  "asyncpg>=0.29",
  "psycopg2-binary>=2.9",
  "sqlalchemy[asyncio]>=2.0",
  "redis>=5.0",
  "aiohttp>=3.9",
  "osmnx>=1.9",
  "networkx>=3.3",
  "h3>=4.0",
  "rapidfuzz>=3.9",
  "albumentations>=1.4",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "minio>=7.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "orjson>=3.10",
  "websockets>=12.0",
  "geoalchemy2>=0.15",
  "shapely>=2.0",
  "aiofiles>=25.1.0",
  "click>=8.1",
  "lap>=0.5.13",
  "fast-alpr[onnx]==0.4.0",
  "pyarrow>=21",
  # --- XtraFlow: SUMO, RL, YOLO demo, analysis, dashboards (exact pins) ---
  "eclipse-sumo==1.21.0",
  "traci==1.21.0",
  "sumolib==1.21.0",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "statsmodels==0.14.4",
  "matplotlib==3.9.2",
  "seaborn==0.13.2",
  "PyYAML==6.0.2",
  "tqdm==4.67.0",
  "gymnasium==0.29.1",
  "stable-baselines3==2.3.2",
  "torch==2.5.1",
  "python-pptx==1.0.2",
  "ultralytics==8.3.28",
  "lapx>=0.5.2",
  "opencv-python-headless==4.10.0.84",
  "imageio==2.36.0",
  "imageio-ffmpeg==0.5.1",
  "streamlit==1.39.0",
  "Pillow==10.4.0",
  "tabulate==0.9.0",
]

[dependency-groups]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "jsonschema>=4.22",
  "mypy>=1.11",
]

[project.scripts]
crossflow = "crossflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crossflow/src/crossflow"]

[tool.pytest.ini_options]
testpaths = ["crossflow/tests"]
pythonpath = [
  "crossflow/src",
  "crosssight/packages/anpr_common/src",
  "crosssight/services/simulator/src",
  "xtraflow",
]
filterwarnings = ["ignore::pytest.PytestDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["crosssight", "xtraflow", "runs"]
