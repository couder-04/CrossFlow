name: crosssight

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18081:8081"
      - "18082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  redpanda-init:
    image: redpandadata/redpanda:v24.2.4
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./infra/redpanda/topics.sh:/topics.sh:ro
    entrypoint: ["/bin/bash", "/topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9009:9000"
    volumes:
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64  # no arm64 build of this tag; emulated on Apple Silicon
    environment:
      POSTGRES_USER: anpr
      POSTGRES_PASSWORD: anpr
      POSTGRES_DB: anpr
    ports:
      - "5433:5432"
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anpr -d anpr"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-07-08T20-59-24Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/anpr-crops || true &&
      exit 0
      "

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"  # in-network port; .env 5433 is the host mapping
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      # Browsers load camera frames / crops from MinIO directly via presigned URLs, which are
      # signed for this host. Set it to the MinIO address users' browsers can reach.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      # CrossFlow signal-control results (read-only mounts below).
      PYTHONPATH: /app/services/api/src:/app/packages/anpr_common/src:/opt/crossflow/src
      CROSSFLOW_XTRAFLOW_DIR: /opt/xtraflow
      CROSSFLOW_RUNS_DIR: /opt/runs
    volumes:
      - ../crossflow/src:/opt/crossflow/src:ro
      - ../xtraflow:/opt/xtraflow:ro
      - ../runs:/opt/runs:ro
    ports:
      - "8000:8000"
    healthcheck:
      # The API image has no curl, and the route is /healthz (not /health).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Monolith workers (demo). Prefer split services below for city-scale.
  workers:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    profiles: ["app"]
    restart: unless-stopped
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"  # in-network port; .env 5433 is the host mapping
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers-ingest:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    profiles: ["app", "prod"]
    restart: unless-stopped
    command: ["python", "-m", "workers.cli", "run", "--worker", "ingest"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"  # in-network port; .env 5433 is the host mapping
      REDIS_URL: redis://redis:6379/0
      HEALTH_PORT: "8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  workers-analytics:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    profiles: ["app", "prod"]
    restart: unless-stopped
    command: ["python", "-m", "workers.cli", "run", "--worker", "analytics"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"  # in-network port; .env 5433 is the host mapping
      REDIS_URL: redis://redis:6379/0
      HEALTH_PORT: "8082"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scale: docker compose --profile prod up -d --scale workers-alerts=3
  workers-alerts:
    build:
      context: .
      dockerfile: services/workers/Dockerfile
    profiles: ["app", "prod"]
    restart: unless-stopped
    command: ["python", "-m", "workers.cli", "run", "--worker", "alerts"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"  # in-network port; .env 5433 is the host mapping
      REDIS_URL: redis://redis:6379/0
      HEALTH_PORT: "8083"
      ALERTS_GROUP_ID: anpr-alerts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    profiles: ["app"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/live
      NEXT_PUBLIC_MAP_STYLE_URL: https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json
      API_INTERNAL_URL: http://api:8000
      # The dashboard middleware verifies the session cookie with the API's secret. Without it
      # every page redirects back to /login after a successful login. Same default as the API.
      JWT_SECRET: ${JWT_SECRET:-change-me-demo-jwt-secret-anpr-platform}
    ports:
      - "3000:3000"
    depends_on:
      - api

  ocr-engine:
    build:
      context: .
      dockerfile: services/ocr_engine/Dockerfile
    profiles: ["ocr", "gpu"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ./models:/models:ro
      - ocr_model_cache:/root/.cache
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy

  ocr-engine-gpu:
    build:
      context: .
      dockerfile: services/ocr_engine/Dockerfile.gpu
    profiles: ["gpu"]
    runtime: nvidia
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      MINIO_ENDPOINT: minio:9000
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ./models:/models:ro
      - ocr_model_cache:/root/.cache
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  ocr_model_cache:  # detector + OCR weights, downloaded once
  clickhouse_data:
  postgres_data:
  minio_data:
