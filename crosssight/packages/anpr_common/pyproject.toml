[project]
name = "anpr-common"
version = "0.1.0"
description = "Shared ANPR schemas, grammar, fuzzy matching, config"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "h3>=4.0",
  "rapidfuzz>=3.9",
  "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anpr_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
