[project]
name = "anpr-ocr-engine"
version = "0.1.0"
description = "ANPR video OCR pipeline: detection, fusion, evaluation"
requires-python = ">=3.11"
dependencies = [
  "anpr-common",
  "ultralytics>=8.2",
  "torch>=2.3",
  "opencv-python-headless>=4.10",
  "albumentations>=1.4",
  "numpy>=1.26",
  "pillow>=10.3",
  "minio>=7.2",
  "redis>=5.0",
  "kafka-python>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "click>=8.1",
  "pyyaml>=6.0",
  "lap>=0.5.13",
  "fast-alpr[onnx]==0.4.0",
  "pandas>=3.0.5",
  "pyarrow>=25.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
plateocr-gpu = ["fast-alpr[onnx-gpu]==0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../packages/anpr_common/src"]
