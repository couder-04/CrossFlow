[project]
name = "anpr-simulator"
version = "0.1.0"
description = "OSM road-graph ANPR event simulator"
requires-python = ">=3.11"
dependencies = [
  "anpr-common",
  "osmnx>=1.9",
  "networkx>=3.3",
  "h3>=4.0",
  "numpy>=1.26",
  "shapely>=2.0",
  "psycopg2-binary>=2.9",
  "redis>=5.0",
  "minio>=7.2",
  "opencv-python-headless>=4.10",
  "clickhouse-connect>=0.7",
  "kafka-python>=2.0",
  "passlib[bcrypt]>=1.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../packages/anpr_common/src"]
