[project]
name = "anpr-workers"
version = "0.1.0"
description = "ANPR stream workers: ingest, analytics, alerts"
requires-python = ">=3.11"
dependencies = [
  "anpr-common",
  "aiokafka>=0.10",
  "clickhouse-connect>=0.7",
  "asyncpg>=0.29",
  "redis>=5.0",
  "aiohttp>=3.9",
  "pydantic>=2.7",
  "orjson>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
